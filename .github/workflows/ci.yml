name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:9QlrOmDX0DRvadFpDqLnY9fm+brfhGV24dgnkRdMzOE=
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: paz_salvo_aaud_testing
      DB_USERNAME: pazsalvo_test
      DB_PASSWORD: testing_password
      PUBLIC_VERIFICATION_BASE_URL: http://public.test/verificar
      USER_TEMPORARY_PASSWORD: ci-fixture-not-for-production
      SEED_TEMPORARY_USER_PASSWORD: e2e-test-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LIBREOFFICE_BINARY: /usr/bin/libreoffice
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paz_salvo_aaud_testing
          POSTGRES_USER: pazsalvo_test
          POSTGRES_PASSWORD: testing_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pazsalvo_test -d paz_salvo_aaud_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
          libreoffice --version
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, gd, mbstring, pdo_pgsql, pgsql, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.1'
          cache: npm
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Production transition tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/production -p 'test_*.py'
          bash tests/production/test_runtime.sh
      - name: Document generation smoke test
        run: php artisan test --filter=CertificateDocumentTest
      - name: Test suite
        run: php artisan test
      - name: Production bootstrap smoke test
        run: |
          php artisan migrate --force
          php artisan db:seed --class=ProductionBootstrapSeeder --force
          php artisan db:seed --class=ProductionBootstrapSeeder --force
      - name: Browser E2E
        env:
          SESSION_DRIVER: file
        run: |
          php artisan migrate:fresh --seed --force
          npx playwright install --with-deps chromium
          npm run test:e2e
      - run: git diff --check

  package-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, gd, mbstring, pdo_pgsql, pgsql, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build production dependencies and assets
        env:
          APP_ENV: testing
          APP_KEY: base64:9QlrOmDX0DRvadFpDqLnY9fm+brfhGV24dgnkRdMzOE=
        run: |
          set -Eeuo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build
      - name: Package immutable release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          git archive --format=tar "$EXPECTED_SHA" | tar -xf - -C "$staging"
          cp -a vendor "$staging/vendor"
          mkdir -p "$staging/public"
          cp -a public/build "$staging/public/build"
          test -f "$staging/artisan"
          test -f "$staging/vendor/autoload.php"
          test -f "$staging/public/index.php"
          test -f "$staging/public/build/manifest.json"
          printf '%s\n' "$EXPECTED_SHA" > "$staging/RELEASE_SHA"
          tar -C "$staging" \
            --exclude='./.github' --exclude='./.env' --exclude='./.env.*' \
            --exclude='./tests' \
            --exclude='./docs' --exclude='./node_modules' \
            --exclude='./storage' --exclude='./bootstrap/cache' \
            --exclude='./phpunit.xml' --exclude='./.gitignore' --exclude='./auth.json' \
            -cf "$RUNNER_TEMP/release.tar" .
          tar -C "$staging" -rf "$RUNNER_TEMP/release.tar" ./storage/app/private/templates
          gzip "$RUNNER_TEMP/release.tar"
          for template in plantilla_paz_y_salvo.xlsx clientes.xlsx assets/AAUD.jpg assets/Firma.jpeg; do
            tar -tzf "$RUNNER_TEMP/release.tar.gz" "./storage/app/private/templates/$template" > /dev/null
          done
          if tar -tzf "$RUNNER_TEMP/release.tar.gz" | grep -E '^\./\.env(\.|$)'; then
            echo 'Production artifact contains an environment file' >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP" && sha256sum release.tar.gz > release.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: pazsalvo-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
