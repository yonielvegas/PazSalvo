name: rollback-production

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release ID (leave blank to list available releases without changing current)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pazsalvo-production
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, production, pazsalvo]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and transition to prepared release
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: bash scripts/production/rollback.sh "$REQUESTED_RELEASE"
